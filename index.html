<style>
:root{
  /* galvanized steel neutrals */
  --ink:#141a1d; --steel-900:#232c31; --steel-700:#3c4850; --steel-500:#6b7a84;
  --steel-300:#aab5bc; --steel-150:#d7dee2; --steel-75:#eef2f4; --paper:#f8fafb;
  /* STFS entity teal */
  --brand:#033e98; --brand-dark:#022b6b; --brand-wash:#e8eef9;
  /* status */
  --amber:#b26a00; --amber-wash:#fdf1e0; --red:#a32020; --red-wash:#fbeaea;
  --green:#2e7d32;
  --rail-1:#033e98; --rail-2:#6b7a84; --rail-3:#b26a00; --rail-4:#aab5bc;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 80px}

/* ---------- header ---------- */
header{
  background:var(--brand); color:#fff; border-bottom:3px solid var(--brand-dark);
  position:sticky; top:0; z-index:50;
}
.hdr{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mark{height:56px;flex:0 0 auto;display:flex;align-items:center;
  font-weight:700;font-size:17px;letter-spacing:1px;color:#fff}
.mark img{height:56px;width:auto;object-fit:contain;display:block}
.titles h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.titles p{margin:1px 0 0;font-size:11.5px;color:#a8bde0;
  font-family:var(--mono);letter-spacing:.02em}
.runmeta{margin-left:auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.runmeta .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#a8bde0;display:block}
.runmeta .v{font-family:var(--mono);font-size:13px;font-weight:500}
.mode{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--amber);color:#fff}
.mode.recommend{background:var(--green)}

/* ---------- notice ---------- */
.notice{background:var(--amber-wash);border-left:3px solid var(--amber);
  padding:11px 14px;margin:18px 0 0;font-size:13px;color:#5c3a00}
.notice b{font-weight:600}

/* ---------- metric rail ---------- */
.rail{display:flex;flex-wrap:wrap;gap:0;margin:18px 0 0;
  border:1px solid var(--steel-150);background:#fff}
.rail div{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--steel-150)}
.rail div:last-child{border-right:0}
.rail .n{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;display:block}
.rail .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel-500);margin-top:2px;display:block}
.rail .sub{font-size:11px;color:var(--steel-500);font-family:var(--mono)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:0;margin:22px 0 0;border-bottom:1px solid var(--steel-150);flex-wrap:wrap}
nav.tabs button{
  appearance:none;border:0;background:none;font-family:var(--sans);font-size:13.5px;
  font-weight:500;color:var(--steel-500);padding:9px 15px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.01em}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--brand-dark);border-bottom-color:var(--brand);font-weight:600}
nav.tabs button .ct{font-family:var(--mono);font-size:11px;color:var(--steel-500);margin-left:5px}
nav.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.controls input[type=search],.controls select{
  font-family:var(--sans);font-size:13px;padding:6px 10px;border:1px solid var(--steel-300);
  border-radius:2px;background:#fff;color:var(--ink)}
.controls input[type=search]{min-width:230px}
.controls input:focus,.controls select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 12px;
  border:1px solid var(--steel-300);background:#fff;border-radius:2px;cursor:pointer;color:var(--steel-700)}
.btn:hover{border-color:var(--brand);color:var(--brand-dark)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.spacer{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--steel-500)}

/* ---------- table ---------- */
.tablewrap{border:1px solid var(--steel-150);background:#fff;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;top:82px;background:var(--steel-75);text-align:left;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--steel-700);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--steel-150);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--brand-dark)}
thead th.num{text-align:right}
thead th .arrow{color:var(--brand);font-size:9px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--steel-75);vertical-align:top}
tbody tr:hover{background:var(--brand-wash)}
td.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.sku{font-family:var(--mono);font-size:12.5px;color:var(--steel-700);white-space:nowrap}
td.name{min-width:230px}
.rail-cell{width:3px;padding:0!important;border-bottom:0!important}
.neg{color:var(--red);font-weight:500}

/* priority pill */
.pri{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;
  padding:1px 7px;border-radius:2px;white-space:nowrap}
.pri-1{background:var(--brand-wash);color:var(--brand-dark)}
.pri-2{background:var(--steel-75);color:var(--steel-700)}
.pri-3{background:var(--amber-wash);color:var(--amber)}
.pri-4{background:var(--steel-75);color:var(--steel-500)}

/* flag chips */
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;
  background:var(--steel-75);color:var(--steel-700);white-space:nowrap;border:1px solid var(--steel-150)}
.chip.warn{background:var(--amber-wash);color:var(--amber);border-color:#f0d6ae}
.chip.bad{background:var(--red-wash);color:var(--red);border-color:#efc9c9}

/* ---------- states ---------- */
.state{padding:44px 20px;text-align:center;color:var(--steel-500);font-size:14px;background:#fff;border:1px solid var(--steel-150)}
.state.error{color:var(--red);background:var(--red-wash);border-color:#efc9c9;text-align:left;padding:16px 18px}
.state.error code{font-family:var(--mono);font-size:12px;display:block;margin-top:6px;color:#7a1a1a;word-break:break-all}
.state h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--steel-500);margin:8px 0 0}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--steel-150);
  font-size:11.5px;color:var(--steel-500);font-family:var(--mono);display:flex;gap:16px;flex-wrap:wrap}
@media(max-width:760px){
  .runmeta{width:100%;margin-left:0;gap:14px}
  thead th{position:static}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="mark" id="mark">STFS</div>
    <div class="titles">
      <h1>Reorder Engine</h1>
      <p>South Texas Fence Supply &middot; inventory review</p>
    </div>
    <div class="runmeta" id="runmeta"></div>
  </div>
</header>

<div class="wrap">
  <div id="notice"></div>
  <div class="rail" id="rail"></div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="controls" id="controls"></div>
  <div id="panel"></div>

  <footer>
    <span id="buildstamp"></span>
    <span>Read-only view</span>
    <span id="lastload"></span>
  </footer>
</div>

<script>
/* =====================================================================
   Data layer. Every view is fetched through this one function, so
   adding writes later means adding a sibling post()/patch() here
   rather than touching the rendering code.
   ===================================================================== */
const api = {
  headers(){
    return { apikey: CONFIG.SUPABASE_KEY,
             Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY };
  },
  async get(view, qs){
    const url = CONFIG.SUPABASE_URL + '/rest/v1/' + view + (qs ? '?' + qs : '');
    const r = await fetch(url, { headers: this.headers() });
    if(!r.ok){
      const body = await r.text();
      throw new Error(r.status + ' ' + r.statusText + ' on ' + view + ' — ' + body.slice(0,300));
    }
    return r.json();
  }
};

/* ---------- formatting ---------- */
const usd  = n => (n===null||n===undefined||isNaN(n)) ? '—'
  : (n<0?'\u2212$':'$') + Math.abs(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd0 = n => (n===null||n===undefined||isNaN(n)) ? '—'
  : (n<0?'\u2212$':'$') + Math.round(Math.abs(+n)).toLocaleString('en-US');
const qty  = n => (n===null||n===undefined||n==='') ? '—'
  : (+n<0?'\u2212':'') + (Math.abs(+n)%1 ? Math.abs(+n).toFixed(2) : Math.abs(+n).toLocaleString('en-US'));
const esc  = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = d => d ? new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : '—';

const CHIP_TONE = { negative_stock:'bad', no_supplier:'bad', zero_cost:'bad',
                    stale_demand:'warn', single_month_demand:'warn',
                    high_variability:'warn', lead_time_default:'warn' };
const chips = flags => !flags || !flags.length ? '<span class="chip">—</span>'
  : '<div class="chips">' + flags.map(f =>
      `<span class="chip ${CHIP_TONE[f]||''}">${esc(f.replace(/_/g,' '))}</span>`).join('') + '</div>';

/* ---------- state ---------- */
const S = { run:null, recs:[], exceptions:[], suppliers:[], dead:[],
            tab:'recs', sort:{}, filters:{} };

/* =====================================================================
   Tabs
   ===================================================================== */
const TABS = [
  { id:'recs',      label:'Reorder list',  count:()=>S.recs.length },
  { id:'blocked',   label:'Blocked',       count:()=>S.exceptions.length },
  { id:'suppliers', label:'By supplier',   count:()=>S.suppliers.length },
  { id:'dead',      label:'Dead stock',    count:()=>S.dead.length }
];

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button role="tab" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${t.label}<span class="ct">${t.count()}</span></button>`
  ).join('');
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.onclick = () => { S.tab = b.dataset.tab; renderTabs(); renderPanel(); });
}

/* =====================================================================
   Sorting + generic table
   ===================================================================== */
function sortRows(rows, key){
  const s = S.sort[S.tab];
  if(!s) return rows;
  const dir = s.dir;
  return [...rows].sort((a,b)=>{
    let x=a[s.key], y=b[s.key];
    if(x===null||x===undefined) return 1;
    if(y===null||y===undefined) return -1;
    if(!isNaN(x) && !isNaN(y) && x!=='' && y!==''){ x=+x; y=+y; }
    else { x=String(x).toLowerCase(); y=String(y).toLowerCase(); }
    return x<y ? -dir : x>y ? dir : 0;
  });
}
function head(cols){
  const s = S.sort[S.tab];
  return '<thead><tr><th class="rail-cell"></th>' + cols.map(c =>
    `<th class="${c.num?'num':''}" data-key="${c.key}">${c.label}` +
    (s && s.key===c.key ? ` <span class="arrow">${s.dir>0?'\u25b2':'\u25bc'}</span>` : '') +
    '</th>').join('') + '</tr></thead>';
}
function bindSort(){
  document.querySelectorAll('thead th[data-key]').forEach(th => th.onclick = () => {
    const k = th.dataset.key, cur = S.sort[S.tab];
    S.sort[S.tab] = (cur && cur.key===k) ? {key:k,dir:-cur.dir} : {key:k,dir:1};
    renderPanel();
  });
}

/* =====================================================================
   Panels
   ===================================================================== */
function filterRecs(){
  const f = S.filters;
  return S.recs.filter(r => {
    if(f.q){
      const q = f.q.toLowerCase();
      if(!((r.sku||'').toLowerCase().includes(q) ||
           (r.name||'').toLowerCase().includes(q) ||
           (r.supplier_name||'').toLowerCase().includes(q))) return false;
    }
    if(f.tier && r.tier !== f.tier) return false;
    if(f.pri === 'action' && r.priority > 2) return false;
    if(f.pri === 'residue' && r.priority <= 2) return false;
    return true;
  });
}

function renderControls(){
  const c = document.getElementById('controls');
  if(S.tab === 'recs'){
    const rows = filterRecs();
    const tot = rows.reduce((t,r)=>t+(+r.extended_cost||0),0);
    c.innerHTML = `
      <input type="search" id="q" placeholder="Search SKU, product, supplier" value="${esc(S.filters.q||'')}">
      <select id="tier">
        <option value="">All tiers</option>
        <option value="A">Tier A only</option>
        <option value="B">Tier B only</option>
      </select>
      <select id="pri">
        <option value="">All rows</option>
        <option value="action">Actionable only</option>
        <option value="residue">Job residue only</option>
      </select>
      <button class="btn" id="csv">Download CSV</button>
      <span class="spacer">${rows.length} shown &middot; ${usd0(tot)}</span>`;
    const q = document.getElementById('q');
    q.oninput = e => { S.filters.q = e.target.value; renderPanel(); q.focus(); };
    document.getElementById('tier').value = S.filters.tier||'';
    document.getElementById('pri').value  = S.filters.pri||'';
    document.getElementById('tier').onchange = e => { S.filters.tier = e.target.value; renderPanel(); };
    document.getElementById('pri').onchange  = e => { S.filters.pri  = e.target.value; renderPanel(); };
    document.getElementById('csv').onclick   = () => downloadCSV(rows);
  } else if(S.tab === 'blocked'){
    c.innerHTML = `<span class="spacer">${S.exceptions.length} products the engine cannot evaluate</span>`;
  } else { c.innerHTML = ''; }
}

function renderPanel(){
  renderControls();
  const p = document.getElementById('panel');

  if(S.tab === 'recs'){
    const cols = [
      {key:'priority',label:'Priority'}, {key:'sku',label:'SKU'}, {key:'name',label:'Product'},
      {key:'supplier_name',label:'Supplier'}, {key:'tier',label:'Tier'},
      {key:'on_hand',label:'On hand',num:1}, {key:'reorder_min',label:'Min',num:1},
      {key:'reorder_max',label:'Max',num:1}, {key:'suggested_qty',label:'Order',num:1},
      {key:'extended_cost',label:'Est. cost',num:1}, {key:'flags',label:'Notes'}
    ];
    const rows = sortRows(filterRecs());
    if(!rows.length){ p.innerHTML = `<div class="state"><h3>Nothing matches those filters</h3>
      <p class="hint">Clear the search or switch tiers to see the full list.</p></div>`; return; }
    p.innerHTML = `<div class="tablewrap"><table>${head(cols)}<tbody>` + rows.map(r => `
      <tr>
        <td class="rail-cell" style="background:var(--rail-${r.priority})"></td>
        <td><span class="pri pri-${r.priority}">${esc(r.assessment||'')}</span></td>
        <td class="sku">${esc(r.sku)}</td>
        <td class="name">${esc(r.name)}</td>
        <td>${esc(r.supplier_name||'\u2014 unassigned \u2014')}</td>
        <td>${esc(r.tier)}</td>
        <td class="num ${+r.on_hand<0?'neg':''}">${qty(r.on_hand)}</td>
        <td class="num">${qty(r.reorder_min)}</td>
        <td class="num">${qty(r.reorder_max)}</td>
        <td class="num"><b>${qty(r.suggested_qty)}</b></td>
        <td class="num">${usd(r.extended_cost)}</td>
        <td>${chips(r.flags)}</td>
      </tr>`).join('') + '</tbody></table></div>';
    bindSort();

  } else if(S.tab === 'blocked'){
    const cols = [{key:'exception_type',label:'Reason'},{key:'sku',label:'SKU'},
      {key:'name',label:'Product'},{key:'on_hand',label:'On hand',num:1},{key:'detail',label:'Detail'}];
    const rows = sortRows(S.exceptions);
    p.innerHTML = `<div class="notice"><b>These products are excluded from the reorder list.</b>
      A negative on-hand means material was sold that was never recorded as received, so the quantity
      on file cannot be compared against a minimum. Ordering against it would compound the error.
      Correct the count in Lightspeed and these rejoin the list on the next run.</div>
      <div class="tablewrap" style="margin-top:14px"><table>${head(cols)}<tbody>` + rows.map(r => `
      <tr>
        <td class="rail-cell" style="background:var(--red)"></td>
        <td><span class="chip bad">${esc((r.exception_type||'').replace(/_/g,' '))}</span></td>
        <td class="sku">${esc(r.sku)}</td>
        <td class="name">${esc(r.name)}</td>
        <td class="num ${+r.on_hand<0?'neg':''}">${qty(r.on_hand)}</td>
        <td style="color:var(--steel-500);font-size:12.5px">${esc(r.detail && r.detail.note || '')}</td>
      </tr>`).join('') + '</tbody></table></div>';
    bindSort();

  } else if(S.tab === 'suppliers'){
    const cols = [{key:'supplier',label:'Supplier'},{key:'products',label:'Products',num:1},
      {key:'units',label:'Units',num:1},{key:'est_cost',label:'Est. cost',num:1},
      {key:'lead_time_days',label:'Lead time',num:1},{key:'lead_time_is_default',label:'Source'}];
    const rows = sortRows(S.suppliers);
    p.innerHTML = `<div class="tablewrap"><table>${head(cols)}<tbody>` + rows.map(r => `
      <tr>
        <td class="rail-cell" style="background:var(--rail-1)"></td>
        <td><b>${esc(r.supplier)}</b></td>
        <td class="num">${qty(r.products)}</td>
        <td class="num">${qty(r.units)}</td>
        <td class="num">${usd(r.est_cost)}</td>
        <td class="num">${qty(r.lead_time_days)} d</td>
        <td>${r.lead_time_is_default
              ? '<span class="chip warn">assumed 14 days</span>'
              : '<span class="chip">confirmed</span>'}</td>
      </tr>`).join('') + `</tbody></table></div>
      <p class="hint">Tier A only. Lead times marked assumed are placeholders until real ranges are supplied \u2014
      every quantity above depends on them.</p>`;
    bindSort();

  } else {
    const cols = [{key:'sku',label:'SKU'},{key:'name',label:'Product'},
      {key:'category_name',label:'Category'},{key:'reason',label:'Reason'},
      {key:'on_hand',label:'On hand',num:1},{key:'value_at_cost',label:'Value at cost',num:1}];
    const rows = sortRows(S.dead);
    const tot = rows.reduce((t,r)=>t+(+r.value_at_cost||0),0);
    p.innerHTML = `<div class="notice"><b>Capital sitting still.</b>
      Stocked products with no demand in the last twelve months, plus fabricated items the engine
      cannot reorder. Total ${usd0(tot)}.</div>
      <div class="tablewrap" style="margin-top:14px"><table>${head(cols)}<tbody>` + rows.map(r => `
      <tr>
        <td class="rail-cell" style="background:var(--rail-4)"></td>
        <td class="sku">${esc(r.sku)}</td>
        <td class="name">${esc(r.name)}</td>
        <td>${esc(r.category_name||'')}</td>
        <td><span class="chip">${esc((r.reason||'').replace(/_/g,' '))}</span></td>
        <td class="num">${qty(r.on_hand)}</td>
        <td class="num">${usd(r.value_at_cost)}</td>
      </tr>`).join('') + '</tbody></table></div>';
    bindSort();
  }
}

/* ---------- CSV ---------- */
function downloadCSV(rows){
  const cols = ['sku','name','supplier_name','tier','assessment','on_hand',
                'reorder_min','reorder_max','suggested_qty','unit_cost','extended_cost',
                'lead_time_days','lead_time_source','flags'];
  const cell = v => Array.isArray(v) ? '"'+v.join(' ')+'"'
    : (v===null||v===undefined) ? ''
    : /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => cell(r[c])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'stfs-reorder-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- header + rail ---------- */

/* Brand chrome paints immediately on page load. It must not depend on
   the fetch — if Supabase is unreachable or has no runs yet, the page
   should still look like the STFS tool rather than an unbranded shell. */
function renderBrand(){
  if(CONFIG.LOGO_DATA_URI){
    document.getElementById('mark').innerHTML =
      `<img src="${CONFIG.LOGO_DATA_URI}" alt="South Texas Fence Supply">`;
  }
  document.getElementById('buildstamp').textContent = CONFIG.BUILD;
  document.getElementById('lastload').textContent = 'Loaded ' + when(new Date());
}

function renderRunMeta(){
  const r = S.run || {};
  document.getElementById('runmeta').innerHTML = `
    <div><span class="k">Last run</span><span class="v">${when(r.run_at)}</span></div>
    <div><span class="k">Mode</span><span class="v"><span class="mode ${r.mode==='recommend'?'recommend':''}">${esc(r.mode||'—')}</span></span></div>`;

  if(S.run && S.run.mode === 'flag_only'){
    document.getElementById('notice').innerHTML = `<div class="notice">
      <b>Flag-only mode.</b> Purchase orders are entered at receiving rather than at ordering,
      so material already on its way is invisible to the system. Quantities below do not account
      for anything in transit \u2014 check before ordering.</div>`;
  }
}

function renderRail(){
  const r = S.run || {};
  const tierA = S.recs.filter(x=>x.tier==='A');
  const act   = S.recs.filter(x=>x.priority<=2);
  const cost  = act.reduce((t,x)=>t+(+x.extended_cost||0),0);
  const blocked = S.exceptions.filter(x=>x.exception_type==='negative_stock').length;
  document.getElementById('rail').innerHTML = `
    <div><span class="n">${r.products_evaluated ?? '—'}</span><span class="l">Products in scope</span></div>
    <div><span class="n">${act.length}</span><span class="l">Actionable</span>
         <span class="sub">${tierA.length} tier A of ${S.recs.length} total</span></div>
    <div><span class="n">${usd0(cost)}</span><span class="l">Estimated spend</span>
         <span class="sub">actionable rows only</span></div>
    <div><span class="n">${blocked}</span><span class="l">Blocked by stock count</span>
         <span class="sub">negative on hand</span></div>
    <div><span class="n">${S.dead.length}</span><span class="l">Dead stock lines</span>
         <span class="sub">${usd0(S.dead.reduce((t,x)=>t+(+x.value_at_cost||0),0))} at cost</span></div>`;
}

/* ---------- boot ---------- */
async function load(){
  renderBrand();                       // brand first, always
  const p = document.getElementById('panel');
  p.innerHTML = '<div class="state">Loading the latest run\u2026</div>';

  if(CONFIG.SUPABASE_URL.includes('YOUR-STFS-PROJECT')){
    p.innerHTML = `<div class="state error"><h3>Not configured yet</h3>
      Open this file and set <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> in the CONFIG
      block at the top to the STFS project's values. Supabase &rarr; Project Settings &rarr; API.</div>`;
    return;
  }

  try{
    const [runs, recs, exc, sup, dead] = await Promise.all([
      api.get('reorder_runs','select=*&order=run_at.desc&limit=1'),
      api.get('v_reorder_priority','select=*&order=priority.asc,extended_cost.desc'),
      api.get('v_reorder_exceptions_latest','select=*&order=on_hand.asc'),
      api.get('v_reorder_by_supplier','select=*'),
      api.get('v_dead_stock','select=*&limit=500')
    ]);
    S.run = runs[0] || null;
    S.recs = recs; S.exceptions = exc; S.suppliers = sup; S.dead = dead;

    if(!S.run){
      p.innerHTML = `<div class="state"><h3>No runs yet</h3>
        <p class="hint">Run <code>select fn_reorder_run('flag_only');</code> in Supabase, then reload.</p></div>`;
      return;
    }
    renderRunMeta(); renderRail(); renderTabs(); renderPanel();
  }catch(err){
    p.innerHTML = `<div class="state error"><h3>Could not load the data</h3>
      Check that the STFS URL and key are correct, and that the views exist and are exposed to the API.
      <code>${esc(err.message)}</code></div>`;
  }
}
load();
</script>
</body>
</html>
