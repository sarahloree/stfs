# STFS tools site (https://stfs.netlify.app).
#
# Link this GitHub repo to that Netlify site before deploying.
# Drag-and-drop deploys will not pick up the function or the env vars.
#
# Site settings > Environment variables, set BEFORE merging:
#   STFD_SUPABASE_URL         https://qdfwovnhlaaocgawukto.supabase.co
#   STFD_SUPABASE_ANON_KEY    STFD publishable key (also in stfd-auth.js)
#   REORDER_ALLOWED_EMAILS    comma-separated rollout list (optional)
#   STFS_SUPABASE_URL         STFS project URL
#   STFS_SUPABASE_SERVICE_KEY STFS secret or service_role key (server only)
# If STFD_SUPABASE_URL or STFD_SUPABASE_ANON_KEY is missing, every
# reorder request returns 503. If the STFS URL or service key is missing,
# the same.
#
# HQ handoff (/.netlify/functions/stfs-hq-redeem) needs these as well.
# Password sign-in and reorder keep working when they are unset; the
# handoff then fails closed and the password form stays up.
#   HQ_STFS_HANDOFF_SECRET    value PJCJ checks as x-handoff-secret
#   PJCJ_ANON_KEY             PJCJ publishable key, sent as apikey
#   STFD_SUPABASE_SERVICE_KEY STFD service_role or sb_secret_ key for
#                             qdfwovnhlaaocgawukto. Not the STFS data key.
#   HQ_CONSUME_URL            optional; defaults to the PJCJ consume function
#
# Ask Lightspeed stays on https://asklightspeed.netlify.app. Do not proxy
# /asklightspeed/* onto this site: that app calls /.netlify/functions/ask
# from the host root, so a prefix rewrite would load the page and miss
# the function.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The STFD URL and publishable key are in stfd-auth.js on purpose.
  SECRETS_SCAN_OMIT_KEYS = "STFD_SUPABASE_URL,STFD_SUPABASE_ANON_KEY"
  # Tests use stand-in tokens. They are not deploy secrets.
  SECRETS_SCAN_OMIT_PATHS = "test/**"

[functions]
  node_bundler = "esbuild"

# Do not add a redirect between /reorderengine and /reorderengine/.
# Netlify matches those paths as the same rule, so a forced 301 from one
# to the other redirects the URL to itself (ERR_TOO_MANY_REDIRECTS).
# Pretty URLs, on by default, already serves reorderengine/index.html.
# Page assets and the data function use absolute paths (/stfd-auth.js,
# /.netlify/functions/reorder-data), so they do not depend on the slash.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
